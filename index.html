<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI</title>
<style>
:root{color-scheme:dark;--bg:#0b0d14;--panel:#111521;--panel2:#171c2b;--line:#252c3d;--text:#eef1fa;--muted:#929bb0;--accent:#9b87ff;--accent2:#7562e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;height:100vh;overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
#auth{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at top,#20203d 0%,var(--bg) 58%)}
.auth-card{width:100%;max-width:410px;background:#111522;border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:0 24px 80px #0007}
.brand{font-size:25px;font-weight:750;letter-spacing:2px;text-align:center;margin-bottom:8px}
.brand span{color:var(--accent)}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:28px}
.tabs{display:flex;background:#0b0e17;padding:4px;border-radius:10px;margin-bottom:20px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:8px}
.tabs button.active{background:#25213f;color:white}
.field{display:block;width:100%;background:#0b0e17;border:1px solid var(--line);border-radius:9px;padding:13px;color:white;outline:none;margin:10px 0}
.field:focus{border-color:var(--accent)}
.primary{width:100%;border:0;border-radius:9px;padding:13px;background:linear-gradient(110deg,var(--accent2),var(--accent));color:white;font-weight:700;margin-top:8px}
.status{min-height:20px;color:#ff9b9b;font-size:12px;text-align:center;margin-top:12px}
#app{height:100vh;display:none}
.layout{display:flex;height:100%}
.sidebar{width:270px;flex-shrink:0;background:#0e121d;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 13px}
.side-brand{font-size:19px;font-weight:800;letter-spacing:2px;padding:5px 10px 22px}
.side-brand span{color:var(--accent)}
.new-chat{background:#1a2030;border:1px solid #30384c;color:white;border-radius:9px;padding:11px;text-align:left;margin-bottom:16px}
.side-label{font-size:11px;color:var(--muted);padding:8px 10px}
#history{overflow:auto;flex:1}
.history-item{width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;border:0;background:transparent;color:#c7cde0;padding:10px;border-radius:8px;font-size:13px}
.history-item:hover,.history-item.selected{background:#20263a}
.user-area{border-top:1px solid var(--line);padding:14px 8px 3px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.user-name{font-size:13px;color:#cbd1e3;overflow:hidden;text-overflow:ellipsis}
.logout{border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 9px;border-radius:8px;font-size:12px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;color:#cbd1e3;font-weight:650}
.topbar small{color:var(--muted);font-weight:400;margin-left:10px}
#messages{flex:1;overflow:auto;padding:28px 18px 16px}
.welcome{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;color:var(--muted)}
.welcome h1{font-size:30px;color:white;margin:0 0 10px}
.welcome p{max-width:440px;line-height:1.6}
.message{max-width:850px;margin:0 auto 22px;display:flex;gap:13px;line-height:1.65}
.avatar{width:30px;height:30px;flex-shrink:0;border-radius:9px;background:#282345;color:#c9bdff;display:grid;place-items:center;font-weight:700;font-size:12px}
.message.user .avatar{background:#253347;color:#b8d7ff}
.content{white-space:pre-wrap;overflow-wrap:anywhere;padding-top:3px}
.composer-wrap{padding:14px 18px 20px}
.composer{max-width:850px;margin:auto;background:#151a28;border:1px solid #30384b;border-radius:14px;display:flex;align-items:flex-end;padding:10px;gap:10px}
#prompt{flex:1;resize:none;max-height:160px;min-height:42px;background:transparent;border:0;outline:0;color:white;padding:10px}
#send{width:40px;height:40px;border:0;border-radius:10px;background:var(--accent2);color:white;font-size:18px}
#send:disabled{opacity:.45;cursor:wait}
.hint{text-align:center;color:#687188;font-size:11px;margin-top:9px}
.mobile-menu{display:none}
@media(max-width:700px){.sidebar{width:220px}.topbar{padding:0 15px}}
@media(max-width:560px){.sidebar{position:absolute;z-index:5;left:-280px;top:0;bottom:0;width:260px;transition:left .2s}.sidebar.open{left:0;box-shadow:15px 0 50px #0009}.mobile-menu{display:inline-block;margin-right:12px;border:0;background:transparent;color:white;font-size:20px}.topbar{height:56px}}
</style>
</head>
<body>
<section id="auth">
  <div class="auth-card">
    <div class="brand">NOVA <span>AI</span></div>
    <div class="sub">Your personal AI workspace</div>
    <div class="tabs">
      <button id="loginTab" class="active" type="button">Log in</button>
      <button id="registerTab" type="button">Create account</button>
    </div>
    <form id="authForm">
      <input id="username" class="field" placeholder="Username" minlength="3" maxlength="24" autocomplete="username" required>
      <input id="password" class="field" type="password" placeholder="Password (at least 10 characters)" minlength="10" maxlength="128" autocomplete="current-password" required>
      <button id="authSubmit" class="primary" type="submit">Log in</button>
      <div id="authStatus" class="status"></div>
    </form>
  </div>
</section>

<section id="app">
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">NOVA <span>AI</span></div>
      <button class="new-chat" id="newChat">＋ &nbsp; New chat</button>
      <div class="side-label">YOUR CONVERSATIONS</div>
      <div id="history"></div>
      <div class="user-area">
        <div class="user-name" id="userName"></div>
        <button class="logout" id="logout">Log out</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
        Nova AI <small>Local model · Qwen3 8B</small>
      </header>
      <div id="messages">
        <div class="welcome" id="welcome">
          <h1>How can I help?</h1>
          <p>Ask Nova anything. Your conversations are saved to your account.</p>
        </div>
      </div>
      <div class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea id="prompt" rows="1" placeholder="Message Nova..." required></textarea>
          <button id="send" type="submit" aria-label="Send">↑</button>
        </form>
        <div class="hint">Nova can make mistakes. Check important information.</div>
      </div>
    </main>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);
let mode = "login";
let token = sessionStorage.getItem("nova_token") || "";
let currentConversation = null;
let busy = false;

function setMode(next) {
  mode = next;
  $("loginTab").classList.toggle("active", mode === "login");
  $("registerTab").classList.toggle("active", mode === "register");
  $("authSubmit").textContent = mode === "login" ? "Log in" : "Create account";
  $("password").autocomplete = mode === "login" ? "current-password" : "new-password";
  $("authStatus").textContent = "";
}
$("loginTab").onclick = () => setMode("login");
$("registerTab").onclick = () => setMode("register");

async function api(path, options = {}) {
  const headers = {"Content-Type":"application/json", ...(options.headers || {})};
  if (token) headers.Authorization = "Bearer " + token;
  const response = await fetch(path, {...options, headers});
  let data = {};
  try { data = await response.json(); } catch {}
  if (!response.ok) {
    if (response.status === 401 && token) {
      token = "";
      sessionStorage.removeItem("nova_token");
      showAuth();
    }
    throw new Error(data.detail || "Request failed");
  }
  return data;
}

function showAuth() {
  $("app").style.display = "none";
  $("auth").style.display = "flex";
}
function showApp(username) {
  $("auth").style.display = "none";
  $("app").style.display = "block";
  $("userName").textContent = username;
  loadHistory();
  showWelcome();
}
function showWelcome() {
  currentConversation = null;
  $("messages").innerHTML = '<div class="welcome" id="welcome"><h1>How can I help?</h1><p>Ask Nova anything. Your conversations are saved to your account.</p></div>';
}
function addMessage(role, content) {
  const wrap = document.createElement("div");
  wrap.className = "message " + role;
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "YOU" : "N";
  const text = document.createElement("div");
  text.className = "content";
  text.textContent = content;
  wrap.append(avatar, text);
  $("messages").appendChild(wrap);
  $("messages").scrollTop = $("messages").scrollHeight;
}
async function loadHistory() {
  try {
    const data = await api("/conversations");
    $("history").innerHTML = "";
    data.conversations.forEach(item => {
      const button = document.createElement("button");
      button.className = "history-item" + (item.id === currentConversation ? " selected" : "");
      button.textContent = item.title;
      button.title = item.title;
      button.onclick = () => openConversation(item.id);
      $("history").appendChild(button);
    });
  } catch (error) {
    console.error(error);
  }
}
async function openConversation(id) {
  try {
    const data = await api("/conversations/" + id);
    currentConversation = id;
    $("messages").innerHTML = "";
    data.messages.forEach(message => addMessage(message.role === "assistant" ? "assistant" : "user", message.content));
    await loadHistory();
    $("sidebar").classList.remove("open");
  } catch (error) {
    alert(error.message);
  }
}
$("authForm").addEventListener("submit", async event => {
  event.preventDefault();
  const username = $("username").value.trim();
  const password = $("password").value;
  $("authSubmit").disabled = true;
  $("authStatus").textContent = "Please wait...";
  try {
    if (mode === "register") {
      await api("/register", {method:"POST", body:JSON.stringify({username, password})});
    }
    const data = await api("/login", {method:"POST", body:JSON.stringify({username, password})});
    token = data.access_token;
    sessionStorage.setItem("nova_token", token);
    $("password").value = "";
    showApp(data.username);
  } catch (error) {
    $("authStatus").textContent = error.message;
  } finally {
    $("authSubmit").disabled = false;
  }
});
$("newChat").onclick = () => {
  showWelcome();
  loadHistory();
  $("sidebar").classList.remove("open");
};
$("logout").onclick = async () => {
  try { await api("/logout", {method:"POST"}); } catch {}
  token = "";
  sessionStorage.removeItem("nova_token");
  currentConversation = null;
  showAuth();
};
$("chatForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (busy) return;
  const message = $("prompt").value.trim();
  if (!message) return;
  busy = true;
  $("send").disabled = true;
  $("prompt").value = "";
  addMessage("user", message);
  const pending = document.createElement("div");
  pending.className = "message assistant";
  pending.id = "pending";
  pending.innerHTML = '<div class="avatar">N</div><div class="content">Nova is thinking...</div>';
  $("messages").appendChild(pending);
  $("messages").scrollTop = $("messages").scrollHeight;
  try {
    const data = await api("/chat", {
      method:"POST",
      body:JSON.stringify({message, conversation_id:currentConversation})
    });
    currentConversation = data.conversation_id;
    pending.remove();
    addMessage("assistant", data.reply);
    await loadHistory();
  } catch (error) {
    pending.remove();
    addMessage("assistant", "Error: " + error.message);
  } finally {
    busy = false;
    $("send").disabled = false;
    $("prompt").focus();
  }
});
$("prompt").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    $("chatForm").requestSubmit();
  }
});
$("mobileMenu").onclick = () => $("sidebar").classList.toggle("open");

async function start() {
  if (!token) return showAuth();
  try {
    const data = await api("/me");
    showApp(data.username);
  } catch {
    token = "";
    sessionStorage.removeItem("nova_token");
    showAuth();
  }
}
start();
</script>
</body>
</html>
